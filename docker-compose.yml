services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: corpus
      POSTGRES_USER: corpus
      POSTGRES_PASSWORD: corpus
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpus -d corpus"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/corpus-private &&
        mc anonymous set private local/corpus-private &&
        mc stat local/corpus-private
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CORPUS_CLIENT_ID: local-development
      CORPUS_DATABASE_URL: postgresql://corpus:corpus@postgres:5432/corpus
    command: ["python", "-m", "app.db.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CORPUS_CLIENT_ID: local-development
      CORPUS_DATABASE_URL: postgresql://corpus:corpus@postgres:5432/corpus
      CORPUS_BLOB_STORE_BACKEND: s3
      CORPUS_S3_ENDPOINT_URL: http://minio:9000
      CORPUS_S3_REGION: us-east-1
      CORPUS_S3_BUCKET: corpus-private
      CORPUS_S3_ACCESS_KEY: minioadmin
      CORPUS_S3_SECRET_KEY: minioadmin
      CORPUS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CORPUS_CLIENT_ID: local-development
      CORPUS_DATABASE_URL: postgresql://corpus:corpus@postgres:5432/corpus
      CORPUS_BLOB_STORE_BACKEND: s3
      CORPUS_S3_ENDPOINT_URL: http://minio:9000
      CORPUS_S3_REGION: us-east-1
      CORPUS_S3_BUCKET: corpus-private
      CORPUS_S3_ACCESS_KEY: minioadmin
      CORPUS_S3_SECRET_KEY: minioadmin
      CORPUS_WORKER_POLL_SECONDS: "2"
      CORPUS_WORKER_LEASE_SECONDS: "30"
      CORPUS_WORKER_PAGE_RETRY_LIMIT: "2"
      CORPUS_WORKER_PAGE_DELAY_SECONDS: "0"
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        NEXT_PUBLIC_REVIEW_TOKEN_REQUIRED: "false"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
