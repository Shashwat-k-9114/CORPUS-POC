# Render Blueprint for the Corpus backend.
#
# STATUS: locally prepared, EXTERNALLY UNVALIDATED. Written against Render's
# documented Blueprint (render.yaml) schema from training knowledge; no live lookup
# against Render's current docs or an actual Render account was possible in this
# session (see DEPLOYMENT.md / DECISIONS.md DEC-009). Confirm field names against
# Render's current docs before the first real deploy, in particular:
#   - "runtime: python" vs. the older "env: python" key
#   - whether healthCheckPath / rootDir are still named exactly this
#
# Deploy as a Render "Web Service" (a persistent process), not a serverless/Function
# product -- this backend keeps an in-memory document registry and writes to local
# temp disk across requests within a single process (see DEC-008, DEC-009).

services:
  - type: web
    name: corpus-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Comma-separated list of browser origins allowed to call this API (CORS).
      # Must be set manually in the Render dashboard once the Vercel frontend URL is
      # known -- deliberately not given a value here so a stale/guessed origin can
      # never ship. See backend/.env.production.example and DEPLOYMENT.md.
      - key: CORPUS_ALLOWED_ORIGINS
        sync: false
