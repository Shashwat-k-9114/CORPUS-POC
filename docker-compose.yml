services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: corpus
      POSTGRES_USER: corpus
      POSTGRES_PASSWORD: corpus
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpus -d corpus"]
      interval: 2s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CORPUS_DATABASE_URL: postgresql://corpus:corpus@postgres:5432/corpus
      CORPUS_BLOB_STORE_ROOT: /data/blobs
    command: ["python", "-m", "app.db.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CORPUS_DATABASE_URL: postgresql://corpus:corpus@postgres:5432/corpus
      CORPUS_BLOB_STORE_ROOT: /data/blobs
      CORPUS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - blob_data:/data/blobs
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CORPUS_DATABASE_URL: postgresql://corpus:corpus@postgres:5432/corpus
      CORPUS_BLOB_STORE_ROOT: /data/blobs
      CORPUS_WORKER_POLL_SECONDS: "2"
      CORPUS_WORKER_LEASE_SECONDS: "30"
      CORPUS_WORKER_PAGE_RETRY_LIMIT: "2"
      CORPUS_WORKER_PAGE_DELAY_SECONDS: "0"
    volumes:
      - blob_data:/data/blobs
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        NEXT_PUBLIC_REVIEW_TOKEN_REQUIRED: "false"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  blob_data:
